name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `worker-configuration.d.ts` is gitignored and regenerated by the
      # `postinstall` hook, which runs `wrangler types` — and that derives the
      # Worker's `Env` from `.dev.vars`. CI has no `.dev.vars`, so without this
      # the generated `Env` would have none of the AI provider keys and CI's
      # types would silently differ from a developer's. Nothing breaks today
      # (`npm run deploy` neither typechecks nor needs those types), but the
      # first `npm run typecheck` added to CI would fail with
      # "Property 'GEMINI_API_KEY' does not exist on type 'Env'".
      #
      # The placeholders are deliberately empty: this is about declaring the
      # binding *names* so the generated types are deterministic. Real values
      # are Worker secrets, pushed by the sync step at the end of this job.
      #
      # Keep this list in step with MODEL_CHAIN in app/lib/ai.server.ts.
      - name: Seed empty AI-key placeholders for type generation
        run: printf 'GEMINI_API_KEY=\nGLM_API_KEY=\nAIHUBMIX_API_KEY=\nOPENROUTER_API_KEY=\n' > .dev.vars

      - name: Install dependencies
        run: npm ci

      # Keep the remote D1 schema in step with the code before uploading, so a
      # push that adds a column never has to race its migration.
      - name: Apply D1 migrations (remote)
        run: npx wrangler d1 migrations apply japanese-vocab-db --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Same command as the manual `npm run deploy`.
      - name: Build and deploy
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_CONVEX_URL: ${{ secrets.VITE_CONVEX_URL }}
          VITE_CONVEX_SITE_URL: ${{ secrets.VITE_CONVEX_SITE_URL }}

      # The AI provider keys are read at *runtime* (`env.GEMINI_API_KEY` in
      # app/lib/ai.server.ts), never baked into the bundle, so they only have to
      # be pushed once and then survive every later deploy. This step keeps them
      # in sync with the GitHub secrets so rotating a key is a one-place edit.
      #
      # It runs after the deploy so the Worker is guaranteed to exist, and each
      # key is skipped when its GitHub secret is absent — a repo without them
      # still deploys cleanly and just leaves whatever is already on the Worker.
      #
      # Note: a Worker that already has a key keeps it when the GitHub secret is
      # removed — deleting a Worker secret is a manual `wrangler secret delete`.
      - name: Sync AI keys to Worker secrets
        run: |
          if [ -z "$GEMINI_API_KEY" ] && [ -z "$GLM_API_KEY" ] && \
             [ -z "$AIHUBMIX_API_KEY" ] && [ -z "$OPENROUTER_API_KEY" ]; then
            echo "No AI key is set in GitHub secrets - nothing to sync."
            exit 0
          fi

          sync_one() {
            name="$1"
            value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
              echo "$name synced to the Worker."
            else
              echo "$name is not set - leaving the existing Worker secret untouched."
            fi
          }

          sync_one GEMINI_API_KEY "$GEMINI_API_KEY"
          sync_one GLM_API_KEY "$GLM_API_KEY"
          sync_one AIHUBMIX_API_KEY "$AIHUBMIX_API_KEY"
          sync_one OPENROUTER_API_KEY "$OPENROUTER_API_KEY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          AIHUBMIX_API_KEY: ${{ secrets.AIHUBMIX_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
